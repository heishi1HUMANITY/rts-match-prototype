<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S04b 選択 2/2 装備</title>
<link rel="stylesheet" href="shared.css">
<style>
  :root { --cc: #ff6a1a; }
  .teambadge { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; background: var(--tc); color: #fff; font-family: var(--f-mono); font-weight: 700; font-size: 10px; letter-spacing: .12em; clip-path: var(--cut-sm); }
  .teambadge .sym { background: #fff; }
  .steps { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; color: var(--faint); }
  .steps .on, .steps .done { color: var(--ink); }
  .steps .n { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid currentColor; font-family: var(--f-mono); font-size: 8.5px; margin-right: 4px; }
  .steps .on .n { background: var(--ink); color: #fff; border-color: var(--ink); }
  .steps .line { width: 24px; height: 1px; background: var(--ink); }
  .clock { display: flex; align-items: baseline; gap: 6px; }
  .clock .num { font-size: 24px; line-height: 1; }
  .clock .bar { width: 90px; align-self: center; }
  .clock .bar > i { background: var(--warn); }

  /* 左: 選んだ指導者を大きめに残す(背景は文明色) */
  .side { position: absolute; left: 0; top: 44px; bottom: 0; width: 230px; overflow: hidden;
    background: var(--hatch), radial-gradient(90% 70% at 50% 80%, color-mix(in srgb, var(--cc) 40%, #fff), transparent 75%), #e6eaee; border-right: 1px solid var(--line); }
  .side .ph { position: absolute; left: 20px; right: 20px; top: 14px; bottom: 0; border-bottom: 0; background: var(--hatch), linear-gradient(180deg, color-mix(in srgb, var(--cc) 22%, rgba(255,255,255,.7)), rgba(255,255,255,.3)); }
  .side .plate { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 10px; background: rgba(255,255,255,.9); backdrop-filter: var(--glass-blur); }
  .side .plate .nm { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .side .back { position: absolute; left: 12px; top: 12px; z-index: 2; }

  .main { position: absolute; left: 244px; right: 14px; top: 54px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot { height: 40px; border: 1px dashed var(--line-2); display: flex; align-items: center; gap: 8px; padding: 0 10px; background: rgba(255,255,255,.4); }
  .slot .k { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--faint); }
  .slot b { font-size: 11px; }
  .slot .x { margin-left: auto; font-family: var(--f-mono); font-size: 10px; opacity: .5; }
  .slot.on { border: 0; background: var(--ink); color: #fff; }
  .slot.on .k { color: rgba(255,255,255,.45); }
  .slot.on.cons { box-shadow: inset 0 3px 0 var(--crayon); }
  .filter { display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; min-height: 0; }
  .ad { padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; position: relative; }
  .ad .ic { width: 26px; height: 26px; margin-bottom: 4px; }
  .ad b { font-size: 11.5px; }
  .ad .ds { font-size: 9.5px; color: var(--ink-2); line-height: 1.35; }
  .ad .kd { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 8.5px; color: var(--dim); }
  .ad.cons { border-top: 2px solid var(--crayon); }
  .ad.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ad.on .ds, .ad.on .kd { color: rgba(255,255,255,.65); }
  .ad.on .ph { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3); }
  .ad.on .ph > * { background: transparent; color: rgba(255,255,255,.6); }
  .ad.on::after { content: "✓"; position: absolute; right: 8px; top: 6px; font-size: 12px; }
  .ad.locked { opacity: .45; background: repeating-linear-gradient(135deg, #fff 0 5px, var(--surface-sunk) 5px 10px); }
  .foot { display: flex; gap: 8px; align-items: center; }
  .foot .sum { flex: 1; font-size: 9.5px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="screen grid-bg">
  <header class="topbar">
    <div class="title"><span class="eyebrow">SELECTION 2 / 2</span><b>装備を選ぶ</b></div>
    <div class="teambadge t-a"><span class="sym diamond"></span>TEAM A</div>
    <div class="steps"><span class="done"><span class="n">✓</span>所属</span><span class="line"></span><span class="on"><span class="n">2</span>装備</span></div>
    <div class="spacer"></div>
    <div class="clock"><span class="eyebrow">LOCK IN</span><span class="num">0:21</span><div class="bar"><i style="width:46%"></i></div></div>
  </header>

  <aside class="side">
    <div class="ph"><span class="ph-k">LEADER · BUST</span><span class="ph-d">ガルシア 腰上 縦長</span></div>
    <button class="btn sm light back">← 所属</button>
    <div class="plate">
      <div class="eyebrow">PMC · LV 7</div>
      <div class="nm">Garcia</div>
      <div class="tiny dim" style="margin-top:2px">攻撃 +12% · 生産 +5% · 維持費 +10%</div>
    </div>
  </aside>

  <main class="main">
    <div class="slots">
      <div class="slot on"><span class="k">1</span><b>前方集積</b><span class="x">×</span></div>
      <div class="slot on"><span class="k">2</span><b>複合装甲</b><span class="x">×</span></div>
      <div class="slot on cons"><span class="k">3</span><b>根回し</b><span class="x">×</span></div>
      <div class="slot"><span class="k">4</span><span class="dim small">空き · タップで追加</span></div>
    </div>
    <div class="filter">
      <div class="seg"><span class="on">すべて 8</span><span>永続 5</span><span>使い切り 3</span></div>
      <span class="tiny dim">使い切りは2枠まで(ランク戦)· 在庫は装備庫と共通</span>
    </div>
    <div class="grid">
      <button class="card ad on"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>前方集積</b><span class="ds">開始補給 +150</span><span class="kd"><span>永続</span><span>★</span></span></button>
      <button class="card ad"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>先遣斥候</b><span class="ds">開始時に斥候1部隊を追加</span><span class="kd"><span>永続</span><span>★</span></span></button>
      <button class="card ad on"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>複合装甲</b><span class="ds">部隊HP +10%</span><span class="kd"><span>永続</span><span>★</span></span></button>
      <button class="card ad"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>広域光学</b><span class="ds">視界 +15%</span><span class="kd"><span>永続</span><span>★</span></span></button>
      <button class="card ad locked"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>衛星照会</b><span class="ds">10秒間マップ全体を見る</span><span class="kd"><span>LOCK · Lv.9</span><span>★★</span></span></button>
      <button class="card ad cons"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>緊急空輸</b><span class="ds">補給 +250(1回)</span><span class="kd"><span style="color:var(--crayon)">使い切り · 在庫 4</span><span>★★</span></span></button>
      <button class="card ad cons locked"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>再集結</b><span class="ds">全部隊のHPを40%回復</span><span class="kd"><span>在庫なし</span><span>★★</span></span></button>
      <button class="card ad cons on"><div class="ph ic"><span class="ph-k" style="font-size:5px;padding:0">IC</span></div><b>根回し</b><span class="ds">指定チームのチケット減少 ×2</span><span class="kd"><span>使い切り · 在庫 1</span><span>★★★</span></span></button>
    </div>
    <div class="foot">
      <span class="sum">時間切れのときは、今の選択(空き枠はそのまま)で自動的に決定します。</span>
      <button class="cta" style="min-width:220px;height:48px"><div><div class="cta-main" style="font-size:19px">決定</div><div class="cta-sub">決定後は変更できません</div></div><div class="cta-go">→</div></button>
    </div>
  </main>
  <div class="mock-id">S04 SELECTION 2/2 · MOCK</div>
</div>
</body>
</html>
