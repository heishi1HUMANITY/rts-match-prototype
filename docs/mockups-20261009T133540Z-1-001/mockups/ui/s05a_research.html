<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S05a 研究画面</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="hud.css">
<style>
  .sheet { position: absolute; left: 0; right: 0; top: 86px; bottom: 0; background: rgba(243,245,247,.94); backdrop-filter: var(--glass-blur); border-top: 1px solid var(--line-2); display: grid; grid-template-columns: minmax(0,1fr) 190px; grid-template-rows: auto 1fr; gap: 0 12px; padding: 8px 14px 12px; }
  .head { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .head .h1 { font-size: 20px; }
  .rp { display: flex; align-items: baseline; gap: 5px; }
  .rp .num { font-size: 18px; }
  .now { flex: 1; display: flex; align-items: center; gap: 10px; padding: 4px 10px; background: var(--surface-solid); border: 1px solid var(--line); max-width: 330px; margin-left: auto; }
  .now .bar { flex: 1; }
  .now .bar > i { background: var(--signal); }
  .main { display: flex; flex-direction: column; min-height: 0; padding-top: 6px; }
  .branches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .br { padding: 4px 8px; border: 1px solid var(--line); background: var(--surface-solid); text-align: left; display: flex; align-items: center; gap: 8px; }
  .br b { font-size: 11px; }
  .br .d { font-size: 8.5px; color: var(--dim); }
  .br .c { margin-left: auto; font-family: var(--f-mono); font-size: 9px; }
  .br.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .br.on .d { color: rgba(255,255,255,.6); }
  .tiers { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 6px; position: relative; }
  .tier { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 8px; position: relative; }
  .tier + .tier { border-left: 1px dashed var(--line-2); }
  .tier .tl { position: absolute; top: 0; left: 8px; }
  .nd { position: relative; padding: 6px 8px 6px; background: var(--surface-solid); border: 1px solid var(--line); text-align: left; }
  .nd b { font-size: 10.5px; display: block; }
  .nd .ds { font-size: 8.5px; color: var(--ink-2); line-height: 1.35; }
  .nd .ft { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--f-mono); font-size: 8px; color: var(--dim); }
  .nd .st { position: absolute; right: 6px; top: 5px; }
  .nd.done { background: var(--ink); color: #fff; border-color: var(--ink); }
  .nd.done .ds, .nd.done .ft { color: rgba(255,255,255,.6); }
  .nd.doing { box-shadow: 0 0 0 1.5px var(--signal); }
  .nd.doing .bar { margin-top: 4px; }
  .nd.doing .bar > i { background: var(--signal); }
  .nd.ex { opacity: .45; }
  .nd.ex b { text-decoration: line-through; }
  .nd.queued { box-shadow: 0 0 0 1.5px var(--ink); }
  .nd.short { border-style: dashed; }
  .xor { align-self: center; font-family: var(--f-mono); font-size: 8.5px; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  .xor::before, .xor::after { content: ""; width: 14px; height: 1px; background: var(--line-2); }
  .side { padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .qi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface-solid); border: 1px solid var(--line); font-size: 10px; }
  .qi .n { font-family: var(--f-display); font-weight: 700; font-size: 13px; width: 14px; }
  .qi .x { margin-left: auto; color: var(--dim); font-family: var(--f-mono); }
  .qi.empty { border-style: dashed; color: var(--faint); background: transparent; }
</style>
</head>
<body>
<div class="screen">
  <div class="board-ph"></div>
  <div class="caseno"><span class="docno">CASE NO: DR-09F9DB4F</span></div>
  <div class="hud-top">
    <div class="tickets">
      <div class="ticket t-a me"><div class="row"><span class="sym diamond"></span><span class="civ">A · PMC</span><span class="rank">#1</span></div><div class="row"><div class="bar" style="flex:1"><i style="width:82%"></i></div><span class="val">820</span></div></div>
      <div class="ticket t-b"><div class="row"><span class="sym square"></span><span class="civ">B · CORP</span><span class="rank">#2</span></div><div class="row"><div class="bar" style="flex:1"><i style="width:71%"></i></div><span class="val">714</span></div></div>
      <div class="ticket t-c"><div class="row"><span class="sym hex"></span><span class="civ">C · ???</span><span class="rank">#3</span></div><div class="row"><div class="bar" style="flex:1"><i style="width:55%"></i></div><span class="val">552</span></div></div>
    </div>
    <div class="timer"><span class="ph-name">MID</span><span class="t">14:32</span></div>
  </div>

  <section class="sheet">
    <div class="head">
      <button class="btn sm light">← 戻る</button>
      <div><span class="eyebrow">RESEARCH · 試合は進行中</span><div class="h1">研究</div></div>
      <div class="rp"><span class="eyebrow">POINTS</span><span class="num">62</span><span class="mono tiny dim">+1.2/s</span></div>
      <div class="now"><span class="eyebrow ink">NOW</span><b style="font-size:10.5px">攻城装備</b><div class="bar"><i style="width:58%"></i></div><span class="mono tiny">0:19</span></div>
    </div>
    <div class="main">
      <div class="branches">
        <button class="br on"><div><b>戦力</b><div class="d">攻撃・部隊上限</div></div><span class="c">1 / 4</span></button>
        <button class="br"><div><b>兵站</b><div class="d">収入・拠点</div></div><span class="c">2 / 4</span></button>
        <button class="br"><div><b>情報</b><div class="d">視界・隠密</div></div><span class="c">0 / 4</span></button>
        <button class="br"><div><b>工兵</b><div class="d">渡河・水上</div></div><span class="c">1 / 4</span></button>
      </div>
      <div class="tiers">
        <div class="tier"><span class="eyebrow tl">TIER 1</span>
          <button class="nd done"><span class="st tag" style="color:#fff;border-color:rgba(255,255,255,.3);height:15px">済</span><b>火力支援</b><span class="ds">攻撃 +15%(PMC 固有)</span><div class="ft"><span>60 RP</span><span>0:30</span></div></button>
        </div>
        <div class="tier"><span class="eyebrow tl">TIER 2</span>
          <button class="nd doing"><b>攻城装備</b><span class="ds">攻城部隊を生産できる</span><div class="bar"><i style="width:58%"></i></div><div class="ft"><span style="color:var(--signal)">研究中 58%</span><span>0:19</span></div></button>
          <span class="xor">⇄ 排他</span>
          <button class="nd ex"><b>機動戦</b><span class="ds">移動 +15%、攻撃 +5%</span><div class="ft"><span>排他で不可</span><span>120 RP</span></div></button>
        </div>
        <div class="tier"><span class="eyebrow tl">TIER 3</span>
          <button class="nd queued"><span class="st tag solid" style="height:15px">予約 1</span><b>対空防御</b><span class="ds">対空車両を生産できる</span><div class="ft"><span>180 RP</span><span>1:00</span></div></button>
        </div>
        <div class="tier"><span class="eyebrow tl">TIER 4</span>
          <button class="nd short"><b>航空戦力</b><span class="ds">攻撃ヘリ、部隊上限 +1</span><div class="ft"><span style="color:var(--danger)">前提不足: 対空防御</span><span>300</span></div></button>
          <span class="xor">⇄ 排他</span>
          <button class="nd short"><b>契約増派</b><span class="ds">部隊上限 +2、攻撃 +15%</span><div class="ft"><span style="color:var(--danger)">前提不足</span><span>300</span></div></button>
        </div>
      </div>
    </div>
    <aside class="side">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow ink">QUEUE · 予約列</span><span class="mono tiny">2 / 3</span></div>
      <div class="qi"><span class="n">1</span>対空防御<span class="x">×</span></div>
      <div class="qi"><span class="n">2</span>前線補給 <span class="tag" style="height:14px">兵站</span><span class="x">×</span></div>
      <div class="qi empty"><span class="n">3</span>空き</div>
      <div class="panel" style="margin-top:auto;padding:8px">
        <div class="eyebrow">TIP</div>
        <div class="small" style="line-height:1.5">排他の2枚はどちらか一方だけ。研究中にタップすると予約列に入ります。</div>
      </div>
    </aside>
  </section>
  <div class="mock-id">S05a RESEARCH · MOCK</div>
</div>
</body>
</html>
