<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S07 アカウント</title>
<link rel="stylesheet" href="shared.css">
<style>
  .brand { position: absolute; left: 36px; top: 40px; bottom: 36px; width: 380px; display: flex; flex-direction: column; }
  .brand .logo { font-family: var(--f-display); font-weight: 700; font-size: 84px; letter-spacing: -0.05em; line-height: 0.82; margin-top: 18px; }
  .brand .logo span { display: block; -webkit-text-stroke: 1.5px var(--ink); color: transparent; }
  .brand .tagline { margin-top: 16px; font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.06em; }
  .brand .meta { margin-top: auto; display: flex; gap: 18px; }
  .brand .meta div { border-left: 1px solid var(--line-2); padding-left: 8px; }
  .brand .meta b { font-family: var(--f-mono); font-size: 10px; font-weight: 500; }
  .form { position: absolute; right: 28px; top: 24px; bottom: 24px; width: 380px; display: flex; flex-direction: column; }
  .form .panel-body { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .methods { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .method { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--surface-solid); border: 1px solid var(--line-2); font-weight: 700; font-size: 10.5px; }
  .method .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 9px; color: #fff; background: var(--ink); }
  .method.wide { grid-column: 1 / 3; justify-content: space-between; background: transparent; border-style: dashed; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .regions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .region { padding: 5px 8px; border: 1px solid var(--line); background: var(--surface-solid); }
  .region.on { box-shadow: 0 0 0 1.5px var(--ink); }
  .region b { font-size: 10px; display: block; }
  .region .ping { font-family: var(--f-mono); font-size: 8.5px; display: flex; align-items: center; gap: 4px; }
  .region .ping i { width: 6px; height: 6px; border-radius: 50%; }
  .select { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--line-2); background: var(--surface-solid); font-size: 10.5px; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 10px; color: var(--ink-2); }
  .check .box { flex: none; width: 14px; height: 14px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 9px; margin-top: 1px; }
  .check a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="crayon-rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter></svg>
<div class="screen grid-bg">
  <section class="brand">
    <div class="docno">FORM 4X-00 · OPERATOR REGISTRATION</div>
    <div class="logo">DREAM<span>4X</span></div>
    <div class="tagline">夢の戦場へ、制度の書式で潜る。</div>
    <div class="meta">
      <div><div class="eyebrow">BUILD</div><b>0.9.4 · S03</b></div>
      <div><div class="eyebrow">SERVER</div><b>ONLINE</b></div>
      <div><div class="eyebrow">AUTHORITY</div><b>国際調停機関</b></div>
    </div>
  </section>
  <svg class="crayon-svg" style="left:300px;top:60px" width="160" height="300" viewBox="0 0 160 300"><path d="M20 10 C 90 60, 40 140, 120 180 S 70 270, 140 290" stroke-width="3"/></svg>

  <section class="panel marks form">
    <div class="panel-head"><span class="eyebrow ink">SIGN IN / 潜行許可の申請</span><span class="tag">STEP 1 / 2</span></div>
    <div class="panel-body">
      <div class="field">
        <span class="eyebrow">ACCOUNT</span>
        <div class="methods">
          <button class="method"><span class="ic"></span>Apple でサインイン</button>
          <button class="method"><span class="ic">G</span>Google で続ける</button>
          <button class="method wide"><span>ゲストで潜行(端末に保存)</span><span class="tiny dim">あとで引き継ぎ可 →</span></button>
        </div>
      </div>
      <div class="field">
        <span class="eyebrow">REGION / サーバー地域</span>
        <div class="regions">
          <div class="region on"><b>東京</b><span class="ping"><i style="background:var(--ok)"></i>24 ms</span></div>
          <div class="region"><b>シンガポール</b><span class="ping"><i style="background:var(--warn)"></i>88 ms</span></div>
          <div class="region"><b>オレゴン</b><span class="ping"><i style="background:var(--danger)"></i>142 ms</span></div>
        </div>
      </div>
      <div class="field">
        <span class="eyebrow">DATE OF BIRTH / 生年月</span>
        <div style="display:flex;gap:4px"><div class="select" style="flex:1"><span class="num">2004</span><span class="dim">年 ▾</span></div><div class="select" style="width:90px"><span class="num">07</span><span class="dim">月 ▾</span></div></div>
      </div>
      <label class="check"><span class="box">✓</span><span><a>利用規約</a> と <a>プライバシー方針</a> に同意します。18歳未満は保護者の同意と月間購入上限が適用されます。</span></label>
      <button class="btn lg block" style="margin-top:auto">申請して潜行する <span class="arrow">→</span></button>
    </div>
  </section>
  <div class="mock-id">S07 ACCOUNT · MOCK</div>
</div>
</body>
</html>
