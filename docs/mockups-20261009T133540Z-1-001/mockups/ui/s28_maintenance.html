<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S28 メンテナンス</title>
<link rel="stylesheet" href="shared.css">
<style>
  .band { position: absolute; left: 0; right: 0; height: 10px; background: var(--hazard); }
  .notice { position: absolute; left: 50px; top: 46px; bottom: 46px; width: 470px; background: #fff; box-shadow: var(--shadow); padding: 20px 24px; display: flex; flex-direction: column; }
  .notice .display { font-size: 40px; margin-top: 8px; }
  .notice .jp { font-size: 15px; font-weight: 900; margin-top: 4px; }
  .window { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-top: 16px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .window .num { font-size: 22px; display: block; line-height: 1.1; }
  .notice p { font-size: 10.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.8; }
  .notice .acts { margin-top: auto; display: flex; gap: 8px; }
  .notice .stamp { position: absolute; right: 26px; top: 26px; font-size: 13px; padding: 4px 10px; border-width: 2.5px; }
  .update { position: absolute; right: 50px; top: 76px; width: 280px; }
  .update .panel-body { display: flex; flex-direction: column; gap: 8px; }
  .ver { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 12px; }
  .ver .old { color: var(--faint); text-decoration: line-through; }
  .variant { position: absolute; right: 50px; top: 52px; }
</style>
</head>
<body>
<div class="screen grid-bg">
  <div class="band" style="top:0"></div>
  <div class="band" style="bottom:0"></div>
  <section class="notice marks">
    <div class="docno">SYSTEM NOTICE · IMA/OPS/0312</div>
    <span class="stamp">停止中</span>
    <div class="display">UNDER<br>MAINTENANCE</div>
    <div class="jp">夢域は現在、定期保守のため閉鎖されています</div>
    <div class="window">
      <div><span class="eyebrow">FROM</span><span class="num">10.10 04:00</span></div>
      <span class="mono dim">→</span>
      <div><span class="eyebrow">UNTIL (予定)</span><span class="num">10.10 07:00</span></div>
    </div>
    <p>試合中の潜行士は自動的に帰還処理されます。この時間に失われた使い切りアドオンは、終了後にお知らせ経由で返却します。</p>
    <div class="acts"><button class="btn">お知らせを見る</button><button class="btn ghost">再読み込み</button><span class="tiny dim mono" style="margin-left:auto;align-self:center">残り 約 1:42</span></div>
  </section>
  <span class="tag variant">VARIANT · 強制更新</span>
  <section class="panel marks update">
    <div class="panel-head"><span class="eyebrow ink">UPDATE REQUIRED</span><span class="tag danger">必須</span></div>
    <div class="panel-body">
      <div class="h2">新しいバージョンがあります</div>
      <div class="ver"><span class="old">0.9.3</span><span>→</span><b>0.9.4</b></div>
      <div class="small dim">更新しないと試合に参加できません。ダウンロード 84 MB。</div>
      <button class="btn block">ストアで更新</button>
    </div>
  </section>
  <div class="mock-id" style="bottom:14px">S28 MAINTENANCE · MOCK</div>
</div>
</body>
</html>
