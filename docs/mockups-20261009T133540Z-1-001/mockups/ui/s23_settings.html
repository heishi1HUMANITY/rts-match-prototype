<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S23 設定</title>
<link rel="stylesheet" href="shared.css">
<style>
  .cats { position: absolute; left: 16px; top: 58px; bottom: 14px; width: 168px; display: flex; flex-direction: column; }
  .cat { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; font-size: 11px; font-weight: 700; color: var(--dim); border-bottom: 1px solid var(--line); text-align: left; }
  .cat .ic { width: 18px; height: 18px; border: 1.5px solid currentColor; display: grid; place-items: center; font-family: var(--f-mono); font-size: 8px; }
  .cat.on { color: #fff; background: var(--ink); }
  .cats .ver { margin-top: auto; padding: 10px 12px; font-family: var(--f-mono); font-size: 8.5px; color: var(--faint); line-height: 1.6; }
  .main { position: absolute; left: 198px; right: 16px; top: 58px; bottom: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .group .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 40px; }
  .group .row:last-child { border-bottom: 0; }
  .group .row b { font-size: 10.5px; display: block; }
  .slider { display: flex; align-items: center; gap: 8px; width: 150px; }
  .slider .trk { position: relative; flex: 1; height: 3px; background: var(--line-2); }
  .slider .trk i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .slider .trk b { position: absolute; top: 50%; width: 12px; height: 12px; background: #fff; border: 2px solid var(--ink); transform: translate(-50%, -50%) rotate(45deg); }
  .slider .v { font-family: var(--f-mono); font-size: 9.5px; width: 22px; text-align: right; }
  .toggle { width: 34px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); }
  .toggle.on { background: var(--ink); }
  .toggle.on::after { left: 18px; }
  .danger-zone { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px dashed rgba(226, 51, 79, 0.5); background: rgba(226, 51, 79, 0.04); }
</style>
</head>
<body>
<div class="screen grid-bg">
  <header class="topbar">
    <button class="back">←</button>
    <div class="title"><span class="eyebrow">CONFIGURATION</span><b>設定</b></div>
    <div class="spacer"></div>
    <button class="btn sm ghost">初期値に戻す</button>
  </header>
  <nav class="panel cats">
    <button class="cat on"><span class="ic">♪</span>サウンド</button>
    <button class="cat"><span class="ic">G</span>グラフィック</button>
    <button class="cat"><span class="ic">OP</span>操作</button>
    <button class="cat"><span class="ic">!</span>通知</button>
    <button class="cat"><span class="ic">あ</span>言語 / 字幕</button>
    <button class="cat"><span class="ic">ID</span>アカウント</button>
    <button class="cat"><span class="ic">⊘</span>通報 / ブロック</button>
    <div class="ver">BUILD 0.9.4 (S03)<br>REGION TOKYO · 24ms<br>ID 4X-7F21-0C9A</div>
  </nav>
  <main class="main">
    <section class="panel group">
      <div class="panel-head"><span class="eyebrow ink">VOLUME / 音量</span></div>
      <div class="row"><div><b>マスター</b></div><div class="slider"><div class="trk"><i style="width:80%"></i><b style="left:80%"></b></div><span class="v">80</span></div></div>
      <div class="row"><div><b>BGM</b></div><div class="slider"><div class="trk"><i style="width:55%"></i><b style="left:55%"></b></div><span class="v">55</span></div></div>
      <div class="row"><div><b>効果音</b></div><div class="slider"><div class="trk"><i style="width:70%"></i><b style="left:70%"></b></div><span class="v">70</span></div></div>
      <div class="row"><div><b>指導者ボイス</b><span class="tiny dim">無線の台詞</span></div><div class="slider"><div class="trk"><i style="width:100%"></i><b style="left:100%"></b></div><span class="v">100</span></div></div>
    </section>
    <section class="panel group">
      <div class="panel-head"><span class="eyebrow ink">BEHAVIOR / 再生</span></div>
      <div class="row"><div><b>無線字幕</b><span class="tiny dim">試合中の台詞を字幕で表示</span></div><span class="toggle on"></span></div>
      <div class="row"><div><b>カットイン</b><span class="tiny dim">拠点制圧・陥落時の演出</span></div><div class="seg"><span>なし</span><span class="on">短縮</span><span>標準</span></div></div>
      <div class="row"><div><b>バックグラウンドで消音</b></div><span class="toggle on"></span></div>
      <div class="row"><div><b>ボイス言語</b></div><div class="seg"><span class="on">日本語</span><span>English</span></div></div>
    </section>
    <div class="danger-zone">
      <span class="tag danger">DANGER</span><span class="small" style="flex:1">ログアウト・データ削除は取り消せません。ゲストの場合は先に引き継ぎ設定をしてください。</span>
      <button class="btn sm light">ログアウト</button><button class="btn sm danger">データ削除</button>
    </div>
  </main>
  <div class="mock-id">S23 SETTINGS · MOCK</div>
</div>
</body>
</html>
