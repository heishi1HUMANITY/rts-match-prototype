  .civ.sel { box-shadow: 0 0 0 2px var(--ink), var(--shadow-sm); }

  .c1 { --tc: #ff6a1a; } .c2 { --tc: #10bfe8; } .c3 { --tc: #7b5cff; } .c4 { --tc: #8a98a6; } .c5 { --tc: #12a874; } .c6 { --tc: #e2334f; }
