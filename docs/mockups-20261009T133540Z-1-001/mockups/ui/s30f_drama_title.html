<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S30f ドラマ(章扉)</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="drama.css">
<style>
  .key { position: absolute; right: 0; top: 0; bottom: 0; width: 52%; border: 0; clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); }
  .doc { position: absolute; left: 34px; top: 30px; bottom: 26px; width: 430px; z-index: 3; display: flex; flex-direction: column; gap: 10px; }
  .doc .no { display: flex; gap: 8px; align-items: center; }
  .doc .ep { font-family: var(--f-display); font-weight: 700; font-size: 64px; letter-spacing: -0.05em; line-height: .85; }
  .doc .ep small { font-size: 16px; letter-spacing: .1em; font-family: var(--f-mono); color: var(--dim); margin-left: 6px; }
  .doc .ttl { font-size: 24px; font-weight: 900; letter-spacing: .04em; line-height: 1.25; }
  .doc .lead { font-size: 10.5px; color: var(--ink-2); line-height: 1.7; max-width: 380px; }
  .cast { display: flex; gap: 8px; }
  .cast .c { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; }
  .cast .ph { width: 44px; height: 44px; }
  .meta { display: flex; gap: 14px; }
  .meta div { font-size: 10px; } .meta .num { font-size: 15px; display: block; }
  .acts { margin-top: auto; display: flex; gap: 8px; align-items: stretch; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="crayon-rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter></svg>
<div class="screen grid-bg">
  <div class="ph key tinted t-d"><span class="ph-k">CHAPTER KEY ART</span><span class="ph-d">章扉の一枚絵 4:3 / 作戦図と少女の線</span></div>
  <section class="doc">
    <div class="no"><span class="docno">STORY · PMC · FRAGMENT</span><span class="tag violet">NEW</span><span class="stamp" style="margin-left:auto;color:var(--crayon)">記録外</span></div>
    <div class="ep">03<small>/ 12</small></div>
    <div class="ttl">紫の線が引かれた地図</div>
    <p class="lead">発電所の案件のあと、PMC の作戦図に誰も描いていない線が残っていた。ガルシアは国際機関の管制室へ向かう。</p>
    <div>
      <div class="eyebrow" style="margin-bottom:4px">CAST · 登場人物</div>
      <div class="cast">
        <div class="c"><div class="ph round tinted t-a"><span class="ph-k" style="font-size:5px;padding:0">PT</span></div>ガルシア</div>
        <div class="c"><div class="ph round tinted" style="--tc:#9aa7b2"><span class="ph-k" style="font-size:5px;padding:0">PT</span></div>ホルム</div>
        <div class="c"><div class="ph round" style="border-color:var(--crayon)"><span class="ph-k" style="font-size:5px;padding:0;color:var(--crayon)">?</span></div><span style="color:var(--crayon)">───</span></div>
      </div>
    </div>
    <div class="meta"><div><span class="num">約 6 分</span><span class="dim">6 場面 · ボイス</span></div><div><span class="num">選択 1</span><span class="dim">返答が変わる</span></div><div><span class="num">+50</span><span class="dim">初回報酬 D</span></div></div>
    <div class="acts">
      <button class="btn ghost" style="height:auto">あらすじで済ませる</button>
      <button class="cta" style="flex:1;min-width:0"><div><div class="cta-main">READ</div><div class="cta-sub">第3話を読む</div></div><div class="cta-go">→</div></button>
    </div>
  </section>
  <svg class="crayon-svg" style="left:250px;top:92px;z-index:4" width="200" height="50" viewBox="0 0 200 50"><path d="M4 36 C 60 10, 120 44, 196 14" stroke-width="3"/></svg>
  <div class="mock-id">S30f DRAMA · CHAPTER TITLE · MOCK</div>
</div>
</body>
</html>
