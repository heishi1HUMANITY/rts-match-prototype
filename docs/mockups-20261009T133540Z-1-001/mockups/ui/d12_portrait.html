<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D12 縦持ちオーバーレイ</title>
<link rel="stylesheet" href="shared.css">
<style>
  .screen.dark { background: radial-gradient(80% 100% at 50% 40%, #1a2530, #0b1218 75%); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .phone { position: relative; width: 120px; height: 120px; }
  .phone .p { position: absolute; left: 50%; top: 50%; width: 44px; height: 80px; border: 2px solid rgba(255,255,255,.3); border-radius: 7px; transform: translate(-50%,-50%); }
  .phone .l { position: absolute; left: 50%; top: 50%; width: 92px; height: 50px; border: 2px solid #fff; border-radius: 8px; transform: translate(-50%,-50%); box-shadow: 0 0 30px rgba(0,180,224,.35); }
  .phone .l::after { content: ""; position: absolute; right: 6px; top: 50%; width: 3px; height: 14px; border-radius: 2px; background: #fff; transform: translateY(-50%); }
  .phone svg { position: absolute; inset: 0; }
  .t1 { font-size: 22px; font-weight: 900; letter-spacing: .06em; }
  .t2 { font-family: var(--f-mono); font-size: 10px; letter-spacing: .3em; color: var(--signal); }
  .hz { position: absolute; left: 0; right: 0; height: 6px; background: var(--hazard); opacity: .8; }
</style>
</head>
<body>
<div class="screen dark">
  <div class="hz" style="top:0"></div><div class="hz" style="bottom:0"></div>
  <div class="center">
    <div class="phone">
      <div class="p"></div><div class="l"></div>
      <svg viewBox="0 0 120 120"><path d="M20 30 A 46 46 0 0 1 60 8" fill="none" stroke="#00b4e0" stroke-width="2"/><path d="M54 3 L 61 8 L 54 13" fill="none" stroke="#00b4e0" stroke-width="2"/><path d="M100 90 A 46 46 0 0 1 60 112" fill="none" stroke="#00b4e0" stroke-width="2"/><path d="M66 107 L 59 112 L 66 117" fill="none" stroke="#00b4e0" stroke-width="2"/></svg>
    </div>
    <div class="t1">横持ちにしてください</div>
    <div class="t2">LANDSCAPE ORIENTATION REQUIRED</div>
    <div class="small dim">作戦卓は横向きでのみ表示されます。回転ロックを解除して端末を横に倒してください。</div>
  </div>
  <div class="mock-id">D12 PORTRAIT OVERLAY · MOCK</div>
</div>
</body>
</html>
