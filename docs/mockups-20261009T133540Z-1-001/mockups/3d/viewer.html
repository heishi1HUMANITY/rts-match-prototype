<style>
  html, body { overflow: hidden; }
  body { background: #e9edf1; }
  #view { position: fixed; inset: 0; }
  .ui { position: fixed; z-index: 2; }
  .side { left: 14px; top: 14px; width: 252px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 28px); overflow: auto; }
  .side h1 { font-family: var(--f-display); font-size: 22px; letter-spacing: -0.02em; line-height: 1; }
  .kv { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; font-size: 10px; }
  .kv dt { color: var(--dim); } .kv dd { font-family: var(--f-mono); font-size: 10px; }
  .grp .eyebrow { display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .row button { height: 26px; padding: 0 10px; font-size: 10px; font-weight: 700; background: var(--surface-solid); border: 1px solid var(--line-2); }
  .row button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .team { width: 26px; padding: 0 !important; display: grid; place-items: center; }
  .team i { width: 11px; height: 11px; display: block; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 10.5px; }
  .chk input { accent-color: #0e161e; }
  .bar { height: 4px; } .bar > i { background: var(--warn); transition: width .1s; }
  .stats { right: 14px; top: 14px; padding: 8px 12px; display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; }
  .stats .v { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .help { right: 14px; bottom: 12px; font-size: 9.5px; color: var(--dim); text-align: right; }
  .cap { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 14px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 700; clip-path: var(--cut-sm); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .cap.on { opacity: 1; }
  .label3d { position: fixed; z-index: 1; transform: translate(-50%, 0); font-size: 9px; font-weight: 700; padding: 1px 6px; background: rgba(255,255,255,.92); border-left: 2px solid var(--ink); white-space: nowrap; pointer-events: none; }
</style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Sky } from "three/addons/objects/Sky.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf1);
const camera = new THREE.PerspectiveCamera(50, 1, 2, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 30; controls.maxDistance = 2400;

// ゲームと同じ照明の考え方: 半球光 + 斜めの平行光(影は落とさない)
const hemi = new THREE.HemisphereLight(0xffffff, 0xb8c2cc, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-300, 600, 200); scene.add(sun);
// 製図の床
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf2f4f6 }));
floor.position.y = -0.2; scene.add(floor);
// 写実表示(アセットの realistic: true のときだけ): 環境の映り込み、トーンマッピング、柔らかい影、影を受ける床
const shadowGround = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.32 }));
shadowGround.position.y = -0.02; shadowGround.receiveShadow = true; shadowGround.visible = false; scene.add(shadowGround);
let envTex = null;
function setRealistic(A) {
  const on = !!A.realistic;
  if (on && !envTex) envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = on ? envTex : null;
  renderer.toneMapping = on ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping; renderer.toneMappingExposure = on ? 1.05 : 1;
  renderer.shadowMap.enabled = on; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sun.castShadow = on; shadowGround.visible = on;
  if (on) { const r = A.shadowR ?? 60, c = sun.shadow.camera; c.left = c.bottom = -r; c.right = c.top = r; c.near = 100; c.far = 1400; c.updateProjectionMatrix(); sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3; sun.shadow.map?.dispose(); sun.shadow.map = null; }
  hemi.intensity = on ? 0.35 : 1.6; sun.intensity = on ? 2.8 : 1.5;
  controls.minDistance = A.minDist ?? 30;
  setPhoto(on && $("photo").checked);
}
camera.layers.enable(1);   // 層 1 = 半透明の粒・光・ベースプレート(環境遮蔽の計算からだけ外す)

// フォトリアル表示(写実版のアセットで「フォトリアル」を入れたとき): 物理的な空と、その空から作る環境光・映り込み、影を受ける土と草の地面、遠くのかすみ、
// 後処理(GTAO の環境遮蔽 → わずかな光のにじみ → トーンマッピング → SMAA → 周辺減光と粒子感)。画像ファイルは使わない
const PHOTO = { on: false, built: false };
function buildPhoto() {
  if (PHOTO.built) return; PHOTO.built = true;
  const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 34), THREE.MathUtils.degToRad(-150));   // 高度 34°、左後ろ寄りから
  const sky = new Sky(); sky.scale.setScalar(4500);
  Object.assign(sky.material.uniforms, {}); const su = sky.material.uniforms;
  su.turbidity.value = 2.2; su.rayleigh.value = 1.6; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.82; su.sunPosition.value.copy(sunDir);
  // 環境光: 空と、下半分に土の色の円盤を置いた場面から PMREM を作る(車体の下側に土の色が回り込む)
  const envScene = new THREE.Scene(), sky2 = new Sky(); sky2.scale.setScalar(900); Object.assign(sky2.material.uniforms, THREE.UniformsUtils.clone(su)); sky2.material.uniforms.sunPosition.value.copy(sunDir); envScene.add(sky2);
  const envGround = new THREE.Mesh(new THREE.CircleGeometry(800, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x5c5444 })); envGround.position.y = -2; envScene.add(envGround);
  PHOTO.env = new THREE.PMREMGenerator(renderer).fromScene(envScene, 0.02, 0.1, 2000).texture;
  // 地面: 乾いた土と草の斑、小石、深い凹凸。車両の周り(半径 40〜80)は踏み固めた裸地
  const gu = { uD1: { value: new THREE.Color(0x977f5c) }, uD2: { value: new THREE.Color(0x6a5440) }, uG1: { value: new THREE.Color(0x5d6a35) }, uG2: { value: new THREE.Color(0x3d4826) }, uPb: { value: new THREE.Color(0x9c978b) } };
  const gm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, metalness: 0 });
  gm.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, gu);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vGP;").replace("#include <begin_vertex>", "#include <begin_vertex>\nvGP = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
      varying vec3 vGP; uniform vec3 uD1, uD2, uG1, uG2, uPb;
      float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float vn(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y), mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
      float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p *= 2.03; a *= 0.5; } return s; }
      float gH(vec3 p) { return fbm(p * 0.05) * 0.5 + fbm(p * 0.45) * 0.35 + smoothstep(0.72, 0.86, vn(p * 1.3)) * 0.45 + vn(p * 4.0) * 0.06; }`)
      .replace("#include <color_fragment>", `#include <color_fragment>
        vec3 gp = vec3(vGP.x, 0.0, vGP.z);
        float fw = length(fwidth(vGP.xz)), near = 1.0 - smoothstep(0.08, 0.6, fw), mid = 1.0 - smoothstep(0.6, 3.0, fw);   // 画素あたりの地面の幅で細かい模様を弱める(遠くのちらつき防止)
        float n1 = fbm(gp * 0.012), n2 = fbm(gp * 0.07 + 3.0), n3 = mix(0.5, fbm(gp * 0.5 + 7.0), mid);
        float bare = 1.0 - smoothstep(45.0, 110.0, length(vGP.xz));
        float g = smoothstep(0.5, 0.62, n1 + 0.18 * n3) * (1.0 - bare * 0.85);
        vec3 col = mix(mix(uD1, uD2, n2), mix(uG1, uG2, n3), g);
        col = mix(col, uPb, smoothstep(0.74, 0.88, vn(gp * 1.3)) * 0.3 * (1.0 - g) * mid);
        col *= 0.82 + 0.36 * n3;
        diffuseColor.rgb = col;`)
      .replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
        { float fw = length(fwidth(vGP.xz)); float hb = gH(vec3(vGP.x, 0.0, vGP.z)) * (1.0 - smoothstep(0.1, 0.8, fw)); vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition); vec3 r1 = cross(dpy, normal), r2 = cross(normal, dpx); float det = dot(dpx, r1);
          vec3 grad = sign(det) * (dFdx(hb) * r1 + dFdy(hb) * r2); normal = normalize(abs(det) * normal - grad * 0.9); }`);
  };
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000).rotateX(-Math.PI / 2), gm); ground.position.y = -0.02; ground.receiveShadow = true;
  PHOTO.objs = [sky, ground]; for (const o of PHOTO.objs) { o.visible = false; scene.add(o); }
  PHOTO.sunDir = sunDir; PHOTO.fog = new THREE.FogExp2(0xb8c7d6, 0.00024);
  // 後処理
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 0 }));
  composer.addPass(new RenderPass(scene, camera));
  PHOTO.aoCam = camera.clone(); PHOTO.aoCam.layers.set(0);
  const gtao = new GTAOPass(scene, PHOTO.aoCam, 1, 1);
  gtao.updateGtaoMaterial({ radius: 7, distanceExponent: 2, thickness: 3, scale: 1.1, samples: 16, distanceFallOff: 1 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
  gtao.blendIntensity = 1.0; composer.addPass(gtao);
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.25, 0.5, 2.5); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  PHOTO.smaa = new SMAAPass(1, 1); composer.addPass(PHOTO.smaa);
  PHOTO.grain = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } }, vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
      void main() { vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; c.rgb *= 1.0 - dot(d, d) * 0.6;
        float n = fract(sin(dot(vUv * vec2(1280.0, 720.0) + uTime * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5; c.rgb += n * 0.014; gl_FragColor = c; }` });
  composer.addPass(PHOTO.grain);
  PHOTO.composer = composer; PHOTO.gtao = gtao; PHOTO.bloom = bloom;
  resizePhoto();
}
function resizePhoto() {
  if (!PHOTO.built) return;
  const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio();
  PHOTO.composer.setPixelRatio(pr); PHOTO.composer.setSize(w, h);
}
function setPhoto(on) {
  if (on) buildPhoto();
  PHOTO.on = on;
  for (const o of PHOTO.objs ?? []) o.visible = on;
  floor.visible = g1.visible = g2.visible = !on;
  scene.background = on ? null : new THREE.Color(0xe9edf1);
  scene.fog = on ? PHOTO.fog : null;
  if (on) {
    scene.environment = PHOTO.env;
    sun.position.copy(PHOTO.sunDir).multiplyScalar(700); sun.color.set(0xfff0dc); sun.intensity = 3.4; hemi.intensity = 0.0;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
    shadowGround.visible = false; camera.fov = 38;
  } else {
    sun.position.set(-300, 600, 200); sun.color.set(0xffffff); camera.fov = 50;
  }
  camera.updateProjectionMatrix();
  if (typeof applyToggles === "function" && cur) applyToggles();
}
const g1 = new THREE.GridHelper(2400, 100, 0xd6dce2, 0xe0e5ea); g1.position.y = -0.1; scene.add(g1);
const g2 = new THREE.GridHelper(2400, 25, 0xc3cbd3, 0xc3cbd3); g2.position.y = -0.05; scene.add(g2);

// 大きさの比較: 現行ゲームの部隊トークン(装甲強襲、表示倍率 2.0)をおおまかに再現
const token = new THREE.Group();
const lam = (c) => new THREE.MeshLambertMaterial({ color: c });
const plate = new THREE.Mesh(new THREE.RingGeometry(32, 38, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: .9, side: THREE.DoubleSide }));
plate.position.y = 0.5; token.add(plate);
const tdisc = new THREE.Mesh(new THREE.CircleGeometry(31, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: .22 }));
tdisc.position.y = 0.4; token.add(tdisc);
const tbody = new THREE.Mesh(new THREE.BoxGeometry(60, 24, 48), lam(0xff6a1a)); tbody.position.y = 20; token.add(tbody);
for (const sx of [-1, 1]) for (const sz of [-1, 0, 1]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(8, 16, 6), lam(0x3b4752)); leg.position.set(sx * 34, 8, sz * 16); leg.rotation.z = sx * 0.4; token.add(leg); }
const turretT = new THREE.Mesh(new THREE.BoxGeometry(24, 10, 20), lam(0x3b4752)); turretT.position.y = 37; token.add(turretT);
token.rotation.y = -0.6; scene.add(token);
const label = document.createElement("div"); label.className = "label3d"; label.textContent = "現行の部隊トークン(装甲強襲)"; document.body.appendChild(label);

// アセット表: 生成、表示倍率、カメラ距離、操作ボタン
const ASSETS = {
  floodgate: {
    kind: "ASSET VIEWER · BASE / LARGE", title: "中央水門", desc: "大拠点の詳細版。終盤に門扉が上がって開放される",

  if (drag.unit) { controls.enabled = false; cur.dragStart(p.x, p.z); try { canvas.setPointerCapture(e.pointerId); } catch {} }
}, { capture: true });
canvas.addEventListener("pointermove", (e) => { if (!drag) return; const p = groundHit(e); if (!p) return; if (p.distanceTo(drag.start) > 6) drag.moved = true; if (drag.unit) cur.dragTo(p.x, p.z); });
canvas.addEventListener("pointerup", (e) => {
  if (!drag) return; const p = groundHit(e);
  if (drag.unit) { cur.dragEnd(); controls.enabled = true; } else if (!drag.moved && p) cur.clickCell?.(p.x, p.z);
  drag = null; drawActions();
});

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); resizePhoto(); }
addEventListener("resize", resize); resize();
load(new URLSearchParams(location.search).get("asset") in ASSETS ? new URLSearchParams(location.search).get("asset") : "tank");

const clock = new THREE.Clock();
const v = new THREE.Vector3();
let statT = 0, uiT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  cur.update(dt);
  controls.update();
  if (PHOTO.on) { PHOTO.aoCam.copy(camera); PHOTO.aoCam.layers.set(0); PHOTO.grain.uniforms.uTime.value += dt; PHOTO.composer.render(dt); } else renderer.render(scene, camera);
  if ((uiT -= dt) <= 0) {   // 状態の表示を同期(動作ボタンの点灯、進捗、字幕)
    uiT = 0.1;
    const acts = ASSETS[curKey].actions(cur);
    [...$("actions").children].forEach((b, i) => b.classList.toggle("on", !!acts[i]?.[2]()));
    if (cur.progress !== undefined) $("prog").style.width = cur.progress * 100 + "%";
    const cap = ASSETS[curKey].caption(cur); $("cap").textContent = cap; $("cap").classList.toggle("on", !!cap);
  }
  v.set(token.position.x, 62, token.position.z).project(camera);
  label.style.display = token.visible && v.z < 1 ? "" : "none";
  label.style.left = (v.x * 0.5 + 0.5) * innerWidth + "px"; label.style.top = (-v.y * 0.5 + 0.5) * innerHeight + "px";
  if ((statT -= dt) <= 0) {
    statT = 0.5;
    const st = cur.stats();
    $("s-tris").textContent = st.tris.toLocaleString(); $("s-draw").textContent = st.draws; $("s-mesh").textContent = st.meshes; $("s-mat").textContent = st.materials;
  }
  requestAnimationFrame(frame);
}
frame();
window.__asset = () => cur; window.__load = load; window.__views = VIEWS; window.__camera = camera; window.__controls = controls;
window.__project = (x, y, z) => { const p = new THREE.Vector3(x, y, z).project(camera); return [(p.x * 0.5 + 0.5) * innerWidth, (-p.y * 0.5 + 0.5) * innerHeight]; };   // 撮影用: 世界座標 → 画面座標
</script>
