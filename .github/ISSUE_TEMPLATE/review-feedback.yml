name: 検査・修正指示
description: CPプレイ検査の結果・差し戻し。Milestone所属の検査結果Issueコメントでも可
title: '[Review] CP_ '
labels: ['flow:ready', 'gate:play']
body:
  - type: input
    id: target
    attributes:
      label: 対象CP・Issue
      description: 分かる範囲で可。親エージェントが検査対象版と紐づける
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 操作と困ったこと・希望
      description: 実際の結果と期待、seed/画面サイズが分かれば記載
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 検査状況
      options:
        - 修正が必要
        - 一部だけ確認した
        - 検査OK
  - type: textarea
    id: remaining
    attributes:
      label: 未検査・補足
  - type: textarea
    id: contract
    attributes:
      label: 修正受入条件・シナリオID・CP・ユーザー検査理由
      description: 親が報告から自動判定可能な修正条件を整理する。操作・表示・時間/強さの修正はユーザー検査要
